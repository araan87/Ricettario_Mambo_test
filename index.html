<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5B47">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ricettario Mambo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥣</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EC; --surface:#FFFFFF; --ink:#1C2622; --muted:#5E6B65; --line:#D3DAD6;
  --accent:#1E5B47; --accent-ink:#FFFFFF; --accent-soft:#DCEBE3;
  --screen:#12201A; --screen-ink:#A8F0CB; --screen-dim:#5F8C77;
  --ok:#2E8B57; --warn:#D99A12; --bad:#C8372D; --none:#9AA5A0;
  --display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --body:'Atkinson Hyperlegible', system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141A17;--surface:#1D2521;--ink:#E7EEEA;--muted:#9AA8A1;--line:#2E3934;--accent:#4FA383;--accent-ink:#0E1512;--accent-soft:#233A30}
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 16px 10px}
.top h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;cursor:pointer;flex:none}
main{padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.78rem;color:var(--muted);cursor:pointer}
.tabs button span{font-size:1.35rem;line-height:1}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.btn{border:0;border-radius:14px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--bad);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.9rem;border-radius:11px}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;margin:4px 0 16px}
.banner{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:16px;border-left:6px solid var(--warn);cursor:pointer}
.banner.bad{border-left-color:var(--bad)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat{position:relative;border:0;padding:0;border-radius:18px;overflow:hidden;aspect-ratio:4/5;background:var(--accent-soft);cursor:pointer;text-align:left}
.cat img{width:100%;height:100%;object-fit:cover}
.cat .emo{position:absolute;inset:0;display:grid;place-items:center;font-size:3.4rem}
.cat .lbl{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(10,20,16,.82));color:#fff}
.cat .lbl b{display:block;font-family:var(--display);font-size:1.05rem;line-height:1.15}
.cat .lbl small{opacity:.85}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px;border:0;text-align:left;cursor:pointer;width:100%}
.thumb{width:74px;height:74px;border-radius:12px;object-fit:cover;flex:none;background:var(--accent-soft);display:grid;place-items:center;font-size:2rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.item b{font-family:var(--display);font-size:1.05rem;line-height:1.2;display:block}
.item small{color:var(--muted)}
.hero{margin:0 -16px 14px;aspect-ratio:16/10;background:var(--accent-soft);display:grid;place-items:center;font-size:4rem;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover}
.rtitle{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.section{margin:22px 0 10px;font-size:1.25rem;font-weight:700}
.ing{list-style:none;padding:0;margin:0;background:var(--surface);border-radius:16px}
.ing li{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
.ing li:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line);transform:translateY(-1px)}
.dot.have{background:var(--ok)}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{background:var(--surface);border-radius:16px;padding:12px 14px 12px 50px;position:relative;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--screen);color:var(--screen-ink);border-radius:9px;padding:3px 9px;font-family:var(--display);font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums}
.chip.note{background:var(--accent-soft);color:var(--accent);font-family:var(--body);font-weight:400}
.chip.off{background:var(--line);color:var(--muted)}
.note-box{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:.92rem}
/* cook mode */
.cook{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.dial{background:var(--screen);color:var(--screen-ink);border-radius:30px;padding:22px 12px 16px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;box-shadow:inset 0 0 0 6px #1d3129, inset 0 0 40px rgba(168,240,203,.06)}
.dial .v{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,8.5vw,2.8rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dial .l{color:var(--screen-dim);font-size:.85rem;margin-top:6px}
.dial .x{grid-column:1/-1;margin-top:14px;padding-top:12px;border-top:1px solid #24392f;color:var(--screen-ink);font-size:.95rem}
.dial .v.dim{color:var(--screen-dim)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;margin:0 auto 6px;background:conic-gradient(var(--screen-ink) calc(var(--p)*1%),#24392f 0);display:grid;place-items:center}
.ring span{width:52px;height:52px;border-radius:50%;background:var(--screen);display:grid;place-items:center;font-size:.8rem}
.steptext{font-size:1.25rem;line-height:1.45;background:var(--surface);border-radius:18px;padding:16px}
.cooknav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.cooknav .btn{padding:16px}
/* pantry */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{border:0;background:var(--surface);border-radius:14px;padding:10px;text-align:left;cursor:pointer;border-top:5px solid var(--none)}
.stat b{font-family:var(--display);font-size:1.6rem;display:block;line-height:1}
.stat.ok{border-top-color:var(--ok)}.stat.warn{border-top-color:var(--warn)}.stat.bad{border-top-color:var(--bad)}
.stat[aria-pressed="true"]{outline:2px solid var(--accent)}
.pitem{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px 12px 10px 10px;border-left:7px solid var(--none)}
.pitem.ok{border-left-color:var(--ok)}.pitem.warn{border-left-color:var(--warn)}.pitem.bad{border-left-color:var(--bad)}
.pitem .info{flex:1;min-width:0}
.pitem b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp{font-size:.88rem;font-weight:700}
.exp.ok{color:var(--ok)}.exp.warn{color:#9C6C00}.exp.bad{color:var(--bad)}.exp.none{color:var(--muted)}
@media (prefers-color-scheme: dark){.exp.warn{color:var(--warn)}}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer}
/* forms & sheet */
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px}
textarea.inp{min-height:130px;resize:vertical}
.sheetwrap{position:fixed;inset:0;z-index:20;background:rgba(8,14,11,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:1.35rem;margin-bottom:12px}
.card{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font-size:1.2rem;margin-bottom:8px}
.card p{margin:.3em 0 .7em}
code.bm{display:block;word-break:break-all;font-size:.72rem;background:var(--bg);border-radius:10px;padding:8px;max-height:90px;overflow:auto}
.empty{text-align:center;padding:40px 12px;color:var(--muted)}
.empty .big{font-size:3rem}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.sugg .score{font-family:var(--display);font-weight:800;color:var(--accent)}
.tag{display:inline-block;font-size:.8rem;border-radius:8px;padding:1px 7px;margin:2px 4px 0 0;background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:#F6E7C2;color:#7A5500}.tag.bad{background:#F5D3CF;color:#8E231B}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.searchbox{margin:4px 0 10px}.searchbox .search{margin:0 0 6px}
.chk{font-size:.88rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.filters{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.fchip small{opacity:.7}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag.ok{background:#D5EFDF;color:#1D6B40}
.btn.tried{background:var(--ok);color:#fff}
.rtools{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
.catsel{flex:1;min-width:180px}.catsel span{display:block;font-size:.85rem;color:var(--muted)}
.catsel .inp{padding:8px 10px}
textarea.inp.notes{min-height:80px}
.editstep{border:0;background:none;color:var(--accent);font-size:.85rem;padding:8px 0 0;cursor:pointer;font-weight:700}
.row > label.f{min-width:90px}
.envbadge{background:#E07B24;color:#fff;font-weight:700;font-size:.75rem;border-radius:8px;padding:3px 8px}
details.note-box summary{cursor:pointer;font-weight:700}
.scanner{position:fixed;inset:0;z-index:40;background:#000}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.guide{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);border:3px solid #A8F0CB;border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5);overflow:hidden}
.guide.barcode{width:min(82vw,520px);height:min(38vw,240px)}
.guide.date{width:min(84vw,540px);height:min(20vw,130px)}
.guide i{position:absolute;left:6%;right:6%;top:50%;height:2px;background:#FF5A4E;box-shadow:0 0 8px #FF5A4E;animation:scanl 1.4s ease-in-out infinite alternate}
.guide.date i{display:none}
@keyframes scanl{from{top:12%}to{top:88%}}
.shint{position:absolute;left:0;right:0;top:calc(40% + min(22vw,140px));text-align:center;color:#fff;padding:0 20px;font-weight:700;text-shadow:0 1px 3px #000}
.slive{font-weight:400;font-size:.9rem;opacity:.9;margin-top:6px;font-family:ui-monospace,monospace}
.sbar{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 12px}
.sbar .btn.ghost{background:rgba(255,255,255,.92);color:#1C2622;border:0}
@media (prefers-reduced-motion: reduce){.guide i{animation:none}}

.portions{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.linkb{border:0;background:none;color:var(--accent);font-weight:700;padding:0;cursor:pointer;text-decoration:underline}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;text-align:center}
.weeknav b{font-family:var(--display);font-size:1.1rem}
.daycard{background:var(--surface);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.daycard.today{outline:2px solid var(--accent)}
.dayhead{display:flex;justify-content:space-between;align-items:center;text-transform:capitalize}
.mentry{display:flex;align-items:center;gap:8px;margin-top:8px}
.mtitle{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:0;cursor:pointer}
.mtitle span:last-child{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.iconbtn.small{width:34px;height:34px;font-size:.9rem;background:var(--bg)}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.daygrid .btn{text-transform:capitalize}
.shopi{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:0;border-radius:14px;padding:10px 12px;text-align:left;width:100%;cursor:pointer}
.shopi .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--accent);display:grid;place-items:center;flex:none;font-weight:700;color:var(--accent-ink);background:transparent}
.shopi.done .box{background:var(--accent)}
.shopi.done .stext{text-decoration:line-through;color:var(--muted)}
.shopi.extra .box{border-style:dashed;color:var(--accent)}
.stext{flex:1;min-width:0}.stext small{display:block;color:var(--muted);font-size:.8rem}
.sendbar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;margin-top:16px;padding:10px 0;background:var(--bg)}
.sendbar .btn{flex:1}
.mrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.card .mrow:last-child{border-bottom:0}
.copyb{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:1.05rem}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;background:var(--screen);color:var(--screen-ink);border-radius:12px;padding:10px 6px;text-align:center}
.mgrid small{display:block;color:var(--screen-dim);font-size:.72rem}
.mgrid b{font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.convgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.convgrid label span{display:block;font-size:.8rem;color:var(--muted);margin-bottom:2px}
.convgrid .inp{padding:8px 10px}

.mamboctl{background:var(--screen);color:var(--screen-ink);border-radius:20px;padding:14px;margin-bottom:12px}
.mbstatus{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.9rem;color:var(--screen-dim)}
.mbind{width:10px;height:10px;border-radius:50%;background:var(--screen-dim);flex:none}
.mbind.on{background:#A8F0CB;box-shadow:0 0 6px #A8F0CB;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.mbdisplay{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px;margin-bottom:12px}
.mbdisplay small{display:block;color:var(--screen-dim);font-size:.7rem}
.mbdisplay b{font-family:var(--display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.mbbtns{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.btn.danger{background:transparent;color:#FF6B6B;border:1px solid #FF6B6B}
.btn.danger:disabled{opacity:.35}
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="backBtn" aria-label="Indietro" hidden>←</button>
  <h1 id="title">Ricettario</h1>
  <span class="envbadge" id="envBadge" hidden>TEST</span>
  <button class="iconbtn" id="addBtn" aria-label="Aggiungi ricetta">＋</button>
</header>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <button data-tab="home"><span>📖</span>Ricette</button>
  <button data-tab="menu"><span>📅</span>Menù</button>
  <button data-tab="pantry"><span>🧺</span>Dispensa</button>
  <button data-tab="suggest"><span>✨</span>Cosa cucino</button>
  <button data-tab="settings"><span>⚙️</span>Altro</button>
</nav>
<div id="toast" class="toast" role="status"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileAny" hidden>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const IS_TEST = /test/i.test(location.pathname);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

/* ================= CATEGORIE ================= */
const CATS = [
  {id:'antipasti', name:'Antipasti', emo:'🫒', kw:['antipast','aperitiv','stuzzich','finger']},
  {id:'primi', name:'Primi piatti', emo:'🍝', kw:['primi','risott','pasta ']},
  {id:'carne', name:'Secondi di carne', emo:'🍗', kw:['carne','salumi']},
  {id:'pesce', name:'Secondi di pesce', emo:'🐟', kw:['pesce','crostace','mollusch']},
  {id:'unici', name:'Piatti unici', emo:'🥘', kw:['piatti-unici','piatti unici','piatto unico']},
  {id:'contorni', name:'Contorni', emo:'🥦', kw:['contorn']},
  {id:'zuppe', name:'Zuppe e minestre', emo:'🍲', kw:['zupp','minestr','vellutat','passati']},
  {id:'salse', name:'Salse, sughi e confetture', emo:'🍅', kw:['salse','sugh','condiment','confettur','spalmabil','marmellat']},
  {id:'pane', name:'Pane e pizze', emo:'🍞', kw:['pane','pizz','focacc']},
  {id:'salati', name:'Torte salate e rustici', emo:'🥧', kw:['forno-salati','forno salati','torte salate','rustic']},
  {id:'dolciforno', name:'Dolci da forno', emo:'🎂', kw:['forno-dolci','forno dolci','torte','biscott','crostat','ciambell']},
  {id:'dessert', name:'Dessert e creme', emo:'🍮', kw:['dessert','praliner','gelat','dolci']},
  {id:'bevande', name:'Bevande', emo:'🥤', kw:['bevand','frullat','liquor','cocktail','smoothie']},
  {id:'bimbi', name:'Pappe per bimbi', emo:'🧸', kw:['infantil','bambin','svezzament']},
  {id:'basi', name:'Basi e preparazioni', emo:'🧂', kw:['basi','base ']},

];

function chunkSteps(lines) {

    if (n <= 1) { out.push(line); continue; }

const FRAC = {'½':.5, '¼':.25, '¾':.75, '⅓':1 / 3, '⅔':2 / 3};
const LEAD_NUM = /^(\s*)(\d+(?:[.,]\d+)?(?:\s+\d\/\d)?|\d\/\d|[½¼¾⅓⅔])(?=[\s a-zA-Zà-ú]|$)/;

  m = t.match(/^(\d)\/(\d)$/); if (m) return m[1] / m[2];

}
function fmtQty(n) {

  if (n < .2) return n.toFixed(1).replace('.', ',');

  const opts = [[0, ''], [.25, '¼'], [1 / 3, '⅓'], [.5, '½'], [2 / 3, '⅔'], [.75, '¾'], [1, '']];
  let b = opts[0];
  for (const o of opts) if (Math.abs(o[0] - fr) < Math.abs(b[0] - fr)) b = o;

}

}

  pz:'pz', pezzo:'pz', pezzi:'pz', rametto:'rametti', rametti:'rametti', mazzetto:'mazzetti', mazzetti:'mazzetti'};

/* ================= DATABASE LOCALE (IndexedDB) ================= */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const q = indexedDB.open(IS_TEST ? 'ricettario-mambo-test' : 'ricettario-mambo', 1);
      q.onupgradeneeded = () => {
        const d = q.result;
        ['recipes', 'pantry', 'kv'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, {keyPath:'id'}); });
      };
      q.onsuccess = () => { this.db = q.result; res(); };
      q.onerror = () => rej(q.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r && r.result);
      t.onerror = () => rej(t.error);
    });
  },
  all(s) { return this.tx(s, 'readonly', st => st.getAll()); },
  put(s, o) { return this.tx(s, 'readwrite', st => st.put(o)); },
  del(s, id) { return this.tx(s, 'readwrite', st => st.delete(id)); },
  clear(s) { return this.tx(s, 'readwrite', st => st.clear()); }
};

/* ---------- Dettaglio ricetta ---------- */
function parseUserTime(v) {
  v = String(v || '').trim();
  if (!v) return 0;
  const m = v.match(/^(\d+):(\d{1,2})$/);
  if (m) return +m[1] * 60 + +m[2];
  if (/^\d+(?:[.,]\d+)?$/.test(v)) return parseFloat(v.replace(',', '.')) * 60;
  return parseParams(v).secs;
}
function mamboFor(r, i) {
  const m = toMambo(r.steps[i] || '', r.format);
  const o = r.ov && r.ov[i];
  if (!o || (o.src && o.src !== r.steps[i])) return m;
  if (o.time) { const s = parseUserTime(o.time); if (s) { m.secs = s; m.time = fmtTime(s); } }
  if (o.temp) m.temp = /^\d+$/.test(o.temp) ? o.temp + '°' : o.temp;
  if (o.speed) m.speed = o.speed;
  if (o.time || o.temp || o.speed) { m.off = false; m.any = true; }
  if (o.note) { m.notes.push(o.note); m.any = true; }
  m.edited = true;
  return m;
}
function chipsHtml(m) {
  if (m.off) return '<div class="chips">' + m.notes.map((n, k) => '<span class="chip ' + (k ? 'note' : 'off') + '">' + esc(n) + '</span>').join('') + '</div>';
  if (!m.any) return '';
  let h = '<div class="chips">';
  if (m.time) h += '<span class="chip">⏱ ' + esc(m.time) + '</span>';
  if (m.temp) h += '<span class="chip">🌡 ' + esc(m.temp) + '</span>';
  if (m.speed) h += '<span class="chip">vel. ' + esc(m.speed) + '</span>';
  m.notes.forEach(n => h += '<span class="chip note">' + esc(n) + '</span>');
  if (m.edited) h += '<span class="chip note">✏️ corretto da te</span>';
  return h + '</div>';
}

function stepSheet(r, i) {
  const m = toMambo(r.steps[i], r.format);
  const o = (r.ov && r.ov[i] && (!r.ov[i].src || r.ov[i].src === r.steps[i])) ? r.ov[i] : {};

/* ---------- Modalità cucina ---------- */
let wakeLock = null, timer = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (e) {} }
function releaseWake() { if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } stopTimer(); }
function stopTimer() { if (timer) { clearInterval(timer.h); timer = null; } }
function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(d => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.25, ac.currentTime + d); o.start(ac.currentTime + d); o.stop(ac.currentTime + d + .2); });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
}
function vCook(c) {
  const r = S.recipes.find(x => x.id === c.id);
  if (!r) { history.back(); return; }
  keepAwake();
  if (!S.cook || S.cook.id !== r.id) S.cook = {id:r.id, i:0};
  const i = S.cook.i, n = r.steps.length, s = r.steps[i] || '';
  const m = mamboFor(r, i);
  setTitle('Passaggio ' + (i + 1) + ' di ' + n);
  let dial;
  if (m.off) dial = '<div class="dial"><div style="grid-column:1/-1"><div class="v dim">Fuori dal Mambo</div><div class="l">' + esc(m.notes[0]) + '</div></div></div>';
  else {
    const running = timer && timer.step === i;
    const left = running ? timer.left : m.secs;
    const pct = running && m.secs ? (100 - left / m.secs * 100) : 0;
    dial = '<div class="dial">' +
      '<div>' + (m.secs ? '<div class="ring" style="--p:' + pct.toFixed(1) + '"><span>' + (running ? '⏳' : '⏱') + '</span></div>' : '') + '<div class="v' + (m.secs ? '' : ' dim') + '" id="dialTime">' + dialTime(left) + '</div><div class="l">tempo</div></div>' +
      '<div><div class="v' + (m.temp ? '' : ' dim') + '">' + esc(m.temp || '–') + '</div><div class="l">temperatura</div></div>' +
      '<div><div class="v' + (m.speed ? '' : ' dim') + '">' + esc(m.speed || '–') + '</div><div class="l">velocità</div></div>' +
      (m.notes.length ? '<div class="x">' + m.notes.map(esc).join('<br>') + '</div>' : '') + '</div>';
  }
  let h = '<div class="cook"><div class="progress"><i style="width:' + ((i + 1) / n * 100) + '%"></i></div>' + dial;
  if (m.secs && !m.off) h += '<button class="btn ghost wide" id="tbtn">' + (timer && timer.step === i ? 'Ferma timer' : 'Avvia timer ' + dialTime(m.secs)) + '</button>';
  if (r.notes) h += '<details class="note-box"><summary>📝 Le mie note</summary><p style="margin:.5em 0 0;white-space:pre-wrap">' + esc(r.notes) + '</p></details>';
  const mqttOk = !!S.set.mqtt;
  if (mqttOk) {
    const isTurbo = m.speed === 'Turbo';
    const hasParams = m.any && !m.off;
    h += '<div class="mamboctl" id="mamboPanel">' +
      '<div class="mbstatus" id="mbSt"><span class="mbind" id="mbInd"></span><span id="mbTxt">In attesa…</span></div>' +
      '<div class="mbdisplay"><div><small>T° reale</small><b id="mbTemp">–</b></div>' +
      '<div><small>Impostata</small><b>' + esc(m.temp || '–') + '</b></div>' +
      '<div><small>Velocità</small><b>' + esc(isTurbo ? 'Turbo' : (m.speed || '–')) + '</b></div>' +
      '<div><small>Tempo</small><b>' + esc(m.time || '–') + '</b></div></div>' +
      (hasParams
        ? '<div class="mbbtns"><button class="btn wide" id="mbStart">' + (isTurbo ? '⚡ Avvia Turbo' : '▶ Avvia sul Mambo') + '</button>' +
          '<button class="btn danger wide" id="mbStop" disabled>⏹ Stop</button></div>' +
          '<p class="muted" style="font-size:.78rem;margin:6px 0 0;text-align:center">Il robot si ferma da solo se il tempo è impostato.</p>'
        : '<p class="muted" style="font-size:.85rem;margin:4px 0">Passaggio senza parametri Mambo (es. solo testo). Imposta i valori manualmente sul robot.</p>' +
          '<button class="btn danger wide" id="mbStop" disabled>⏹ Stop emergenza</button>') +
    '</div>';
  }
  h += '<div class="steptext">' + esc(s) + '</div>';
  h += '<div class="cooknav"><button class="btn ghost" id="prev" ' + (i === 0 ? 'disabled' : '') + '>Indietro</button><button class="btn" id="next">' + (i === n - 1 ? 'Fine 🎉' : 'Avanti') + '</button></div>';
  h += '<details><summary class="muted">Ingredienti</summary><ul class="ing" style="margin-top:8px">' + r.ingredients.map(x => '<li>' + esc(scaleLine(x, factorOf(r))) + '</li>').join('') + '</ul></details></div>';
  $('#app').innerHTML = h;
  $('#prev').onclick = () => { stopTimer(); S.cook.i = Math.max(0, i - 1); render(); };
  $('#next').onclick = () => { stopTimer(); if (i === n - 1) {
      if (!r.tried && confirm('Buon appetito! Segno la ricetta come provata?')) { r.tried = true; r.triedAt = Date.now(); DB.put('recipes', r); }
      else toast('Buon appetito!');
      history.back();
    } else { S.cook.i = i + 1; render(); window.scrollTo(0, 0); } };
  // --- pannello Mambo ---
  const mbStart = $('#mbStart'), mbStop = $('#mbStop');
  let mbPollT = null;
  function mbSetStatus(running, txt) {
    const ind = $('#mbInd'), tx = $('#mbTxt'), st = $('#mbSt');
    if (!ind) return;
    ind.className = 'mbind' + (running ? ' on' : '');
    tx.textContent = txt;
  }
  async function mbCall(path, body) {
    const u = S.set.mqtt + '/' + path;
    const r = await fetch(u, { method: body ? 'POST' : 'GET',
      headers: {'X-Api-Key': S.set.mqttKey, 'Content-Type': 'application/json'},
      body: body ? JSON.stringify(body) : undefined,
      signal: AbortSignal.timeout(12000)
    });
    return r.json();
  }
  function startPoll() {
    if (mbPollT) return;
    mbPollT = setInterval(async () => {
      try {
        const j = await mbCall('status');
        const tmp = $('#mbTemp'); if (tmp) tmp.textContent = j.temp != null ? j.temp + '°C' : '–';
        mbSetStatus(j.running, j.running ? 'In cottura…' : (j.errorCode && j.errorCode !== '00' ? 'Errore: ' + j.errorCode : 'Fermo'));
        if (!j.running && mbStop && !mbStop.disabled) {
          mbStop.disabled = true; if (mbStart) mbStart.disabled = false;
          mbSetStatus(false, 'Passaggio completato ✓'); beep();
        }
      } catch (e) { /* ignora errori di poll */ }
    }, 3000);
  }
  function stopPoll() { if (mbPollT) { clearInterval(mbPollT); mbPollT = null; } }
  if (mbStart) mbStart.onclick = async () => {
    if (!S.set.mqtt) { toast('Configura il Worker MQTT in Altro'); return; }
    if (!confirm('Avvia il Mambo con: vel. ' + (m.speed || '–') + ', ' + (m.temp || '0') + '°C, ' + (m.time || 'tempo libero') + '?')) return;
    mbStart.disabled = true; mbStart.textContent = '⏳ Avvio…';
    try {
      const isTurbo = m.speed === 'Turbo';
      const path = isTurbo ? 'turbo' : 'start';
      const body = isTurbo ? null : { speed: m.speed || '1', temp: parseInt(m.temp) || 0, time: m.secs || 0 };
      const j = await mbCall(path, body);
      if (j.ok) { mbStop.disabled = false; mbSetStatus(true, 'Avviato ✓'); startPoll(); mbStart.textContent = isTurbo ? '⚡ Avvia Turbo' : '▶ Avvia sul Mambo'; }
      else { toast('Errore: ' + (j.error || 'sconosciuto')); mbStart.disabled = false; mbStart.textContent = '▶ Avvia sul Mambo'; }
    } catch (e) { toast('Non raggiungibile: ' + e.message); mbStart.disabled = false; mbStart.textContent = '▶ Avvia sul Mambo'; }
  };
  if (mbStop) mbStop.onclick = async () => {
    mbStop.disabled = true;
    try { await mbCall('stop', {}); stopPoll(); mbSetStatus(false, 'Fermato'); if (mbStart) mbStart.disabled = false; }
    catch (e) { toast('Errore stop: ' + e.message); mbStop.disabled = false; }
  };
  // polling immediato allo start
  if ($('#mamboPanel') && S.set.mqtt) {
    (async () => {
      try {
        const j = await mbCall('status');
        const tmp = $('#mbTemp'); if (tmp) tmp.textContent = j.temp != null ? j.temp + '°C' : '–';
        const offline = j.offline || !j.temp;
        mbSetStatus(false, offline ? '🔴 Mambo spento o offline' : '🟢 Mambo pronto');
      } catch (e) { mbSetStatus(false, '⚠️ Worker non raggiungibile'); }
    })();
  }
  // cleanup al cambio step
  const origNext = $('#next').onclick;
  $('#next').onclick = () => { stopPoll(); if (origNext) origNext(); };
  const origPrev = $('#prev').onclick;
  $('#prev').onclick = () => { stopPoll(); if (origPrev) origPrev(); };
  const tb = $('#tbtn');
  if (tb) tb.onclick = () => {
    if (timer && timer.step === i) { stopTimer(); render(); return; }
    stopTimer();
    timer = {step:i, left:Math.round(m.secs), h:null};
    timer.h = setInterval(() => {
      timer.left--;
      if (timer.left <= 0) { stopTimer(); beep(); toast('Tempo scaduto!'); render(); return; }
      const el = $('#dialTime'), ring = $('.ring');
      if (el) el.textContent = dialTime(timer.left);
      if (ring) ring.style.setProperty('--p', (100 - timer.left / m.secs * 100).toFixed(1));
    }, 1000);
    render();
  };
}

function compressImage(file, max = 1100) {
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', .8));
    };
    img.onerror = () => res('');
    img.src = url;
  });
}

/* ---------- Import ---------- */
function decodePayload(txt) {
  txt = String(txt || '').trim();
  if (txt.startsWith('MAMBO:')) txt = txt.slice(6);
  if (txt.startsWith('{')) return JSON.parse(txt);
  if (/^[A-Za-z0-9+/=_-]{40,}$/.test(txt)) return JSON.parse(decodeURIComponent(escape(atob(txt.replace(/-/g, '+').replace(/_/g, '/')))));
  return parsePlainText(txt);
}
function parsePlainText(txt) {
  const lines = txt.split('\n').map(x => x.replace(/^[\s•\-*·▪]+/, '').trim()).filter(Boolean);
  const iI = lines.findIndex(l => /^ingredienti\b/i.test(l));
  const iP = lines.findIndex(l => /^(preparazione|procedimento|istruzioni)\b/i.test(l));
  if (iI < 0 && iP < 0) return {title:lines[0] || 'Nuova ricetta', ingredients:[], steps:lines.slice(1)};
  const endI = iP > iI ? iP : lines.length;
  return {
    title: lines.slice(0, Math.max(iI, 0) || 1)[0] || 'Nuova ricetta',
    ingredients: iI >= 0 ? lines.slice(iI + 1, endI) : [],
    steps: iP >= 0 ? lines.slice(iP + 1) : []
  };
}
function isoDur(t) {
  const m = String(t || '').match(/^P(?:T)?(?:(\d+)H)?(?:(\d+)M)?/i);
  if (!m || (!m[1] && !m[2])) return String(t || '');
  return fmtTime((+m[1] || 0) * 3600 + (+m[2] || 0) * 60);
}
function payloadToDraft(d) {
  const path = d.source ? (() => { try { return new URL(d.source).pathname; } catch (e) { return ''; } })() : '';
  let cat = guessCat(path + ' ' + (d.category || ''));
  if (cat === 'altro') cat = guessCat(d.title || '');
  return {
    title: String(d.title || '').replace(/\s*[|–-]\s*(ricettario|bimby|cookidoo).*$/i, '').trim() || 'Nuova ricetta',
    category: cat, image: d.image || '', servings: String(d.servings || '').replace(/[^\d–-]/g, ''),
    time: isoDur(d.time), ingredients: (d.ingredients || []).map(x => String(x).replace(/\s+/g, ' ').trim()).filter(Boolean),
    steps: chunkSteps(d.steps || []), format: 'bimby', source: d.source || ''
  };
}

/* ---- OCR steps da foto (solo per importPreview) ---- */
let _ocrW=null,_ocrP=null;
function _getOcr(){
  if(_ocrW)return Promise.resolve(_ocrW);
  if(!_ocrP)_ocrP=(async()=>{
    if(!window.Tesseract)await new Promise((res,rej)=>{
      const sc=document.createElement('script');
      sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
      sc.onload=res; sc.onerror=()=>{_ocrP=null;rej(new Error('Tesseract non caricato'));};
      document.head.appendChild(sc);
    });
    const w=await Tesseract.createWorker(['ita','eng']);
    await w.setParameters({tessedit_pageseg_mode:'4'});
    _ocrW=w; return w;
  })().catch(e=>{_ocrP=null;throw e;});
  return _ocrP;
}
function _pickFiles(){
  return new Promise(res=>{
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='image/*'; inp.multiple=true;
    inp.onchange=()=>res(inp.files.length?Array.from(inp.files):null);
    inp.click();
  });
}
function _parseSteps(text){
  // Cookidoo: numeri in grigio isolati (1, 2, 3) senza punto, poi testo
  // Pulisci simboli speciali Bimby (↺, icone velocità/temperatura come caratteri Unicode)
  let clean=text
    .replace(/[\u21BA\u21BB\u21B6\u21B7\u2B6F\u2B6E]/g,' antiorario ')   // ↺ e simili
    .replace(/[^\x00-\x7F\u00C0-\u024F\u00B0\u2019\u2018\u201C\u201D\/]/g,' ')  // lascia lettere latine, °, /
    .replace(/[ \t]{2,}/g,' ');

  const lines=clean.split('\n').map(l=>l.trim()).filter(l=>l.length>0);

  // riconosce inizio step in questi formati:
  //   "1 Testo"   "1. Testo"   "1) Testo"
  //   "1"  (numero isolato, il testo viene nella riga/righe successive)
  const IS_STEP_INLINE=l=>/^\d{1,2}[.\)]\s+\S/.test(l)||/^\d{1,2}\s{2,}\S/.test(l);
  const IS_NUM_ALONE=l=>/^\d{1,2}$/.test(l);
  const IS_PARAM=l=>/\d+\s*(sec|min|h\b|ora|°|vel|turbo|varoma|antior|sottovuoto)/i.test(l);
  const IS_SKIP=l=>/^(preparazione|ingredienti|allergeni|difficolt|calorie|kcal|attrezz|note:|titolo)/i.test(l);

  const steps=[];let buf='';let pendingNum=false;

  for(const l of lines){
    if(IS_SKIP(l)){pendingNum=false;continue;}

    if(IS_NUM_ALONE(l)){
      // numero isolato: il testo arriva nella prossima riga
      if(buf.trim())steps.push(buf.trim());
      buf=''; pendingNum=true;
      continue;
    }

    if(IS_STEP_INLINE(l)){
      // numero + testo sulla stessa riga
      if(buf.trim())steps.push(buf.trim());
      buf=l.replace(/^\d{1,2}[.\)?\s]\s*/,'').trim();
      pendingNum=false;
      continue;
    }

    if(pendingNum){
      // prima riga di testo dopo un numero isolato
      buf=l; pendingNum=false;
      continue;
    }

    // continuazione del passaggio corrente
    if(buf&&(IS_PARAM(l)||l.length<220)){
      buf+=' '+l;
    }
  }
  if(buf.trim())steps.push(buf.trim());
  return steps;
}
async function _ocrFiles(files){
  const sorted=[...files].sort((a,b)=>a.lastModified-b.lastModified||a.name.localeCompare(b.name));
  const w=await _getOcr(); let txt='';
  for(const f of sorted){
    const img=await new Promise((res,rej)=>{
      const im=new Image(),u=URL.createObjectURL(f);
      im.onload=()=>{URL.revokeObjectURL(u);res(im);};
      im.onerror=()=>rej(new Error('Immagine non leggibile'));
      im.src=u;
    });
    const MAX=2000,sc=Math.min(1,MAX/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');
    cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
    const ctx=cv.getContext('2d');
    ctx.filter='contrast(1.8) brightness(1.05) grayscale(1)';
    ctx.drawImage(img,0,0,cv.width,cv.height);
    const{data}=await w.recognize(cv); txt+='\n'+data.text;
  }
  return _parseSteps(txt);
}

/* ---------- Import da link (menu Condividi o link incollato) ----------
   Il browser non può leggere direttamente pagine di altri siti (CORS),
   quindi la pagina viene scaricata tramite un servizio proxy pubblico. */
const PROXIES = [
  {name:'Jina', url:u => 'https://r.jina.ai/' + u, headers:{'X-Return-Format':'html'}},
  {name:'AllOrigins', url:u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)},
  {name:'corsproxy.io', url:u => 'https://corsproxy.io/?url=' + encodeURIComponent(u)},
  {name:'cors.lol', url:u => 'https://api.cors.lol/?url=' + encodeURIComponent(u)},
  {name:'CodeTabs', url:u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)}
];
let lastFetchErrors = [];
async function tryProxy(p, url) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(p.url(url), {signal:ctl.signal, headers:p.headers || {}});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const h = await r.text();
    if (h.length < 800) throw new Error('risposta vuota');
    if (!/ingredient|recipe|ricett/i.test(h)) throw new Error('pagina senza ricetta');
    return h;
  } catch (e) {
    throw new Error(p.name + ': ' + (e.name === 'AbortError' ? 'timeout' : (e.message === 'Failed to fetch' ? 'bloccato/non raggiungibile' : e.message)));
  } finally { clearTimeout(t); }
}
async function fetchPage(url) {
  const list = PROXIES.slice();
  if (S.set.proxy) list.unshift({name:'Proxy personale', url:u => S.set.proxy + encodeURIComponent(u)});
  try { return await Promise.any(list.map(p => tryProxy(p, url))); }
  catch (agg) { lastFetchErrors = (agg.errors || []).map(e => e.message); throw new Error('download'); }
}
function extractRecipe(doc, pageUrl) {
  let r = null;
  const find = o => {
    if (!o || r) return;
    if (Array.isArray(o)) { o.forEach(find); return; }
    if (typeof o !== 'object') return;
    if (o['@graph']) find(o['@graph']);
    const t = o['@type'];
    if (t === 'Recipe' || (Array.isArray(t) && t.includes('Recipe'))) r = o;
  };
  doc.querySelectorAll('script[type="application/ld+json"]').forEach(s => { try { find(JSON.parse(s.textContent)); } catch (e) {} });
  const txt = el => ((el && el.textContent) || '').replace(/\s+/g, ' ').trim();
  const meta = p => { const m = doc.querySelector('meta[property="' + p + '"],meta[name="' + p + '"]'); return m ? m.getAttribute('content') || '' : ''; };
  const img = i => { if (!i) return ''; if (typeof i === 'string') return i; if (Array.isArray(i)) return img(i[0]); return i.url || i.contentUrl || ''; };
  const steps = ins => {
    const out = [];
    (function walk(x) {
      if (!x) return;
      if (typeof x === 'string') { x.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, ' ').split(/\n+/).forEach(l => { l = l.replace(/\s+/g, ' ').trim(); if (l) out.push(l); }); return; }
      if (Array.isArray(x)) { x.forEach(walk); return; }
      if (x.itemListElement) walk(x.itemListElement); else if (x.text) walk(x.text); else if (x.name) walk(x.name);
    })(ins);
    return out;
  };
  const listAfter = re => {
    const hs = doc.querySelectorAll('h1,h2,h3,h4,h5,h6,strong,b,dt,span,p,div,button,a');
    for (const h of hs) {
      const t = txt(h);
      if (t.length > 40 || !re.test(t) || h.children.length > 3) continue;
      let n = h;
      for (let k = 0; k < 10 && n; k++) {
        n = n.nextElementSibling || (n.parentElement && n.parentElement.nextElementSibling);
        if (!n) break;
        let items = n.matches('li') ? [n] : Array.from(n.querySelectorAll('li'));
        if (!items.length && re.source.includes('prepar')) items = Array.from(n.querySelectorAll('p'));
        const vals = items.map(txt).filter(Boolean);
        if (vals.length) return vals;
      }
    }
    return [];
  };
  let ing = r ? [].concat(r.recipeIngredient || r.ingredients || []).map(x => String(x).trim()).filter(Boolean) : [];
  if (!ing.length) ing = Array.from(doc.querySelectorAll('[itemprop="recipeIngredient"],[itemprop="ingredients"]')).map(txt).filter(Boolean);
  if (!ing.length) ing = listAfter(/^ingredienti/i);
  let st = r ? steps(r.recipeInstructions) : [];
  if (!st.length) st = Array.from(doc.querySelectorAll('[itemprop="recipeInstructions"] li,[itemprop="recipeInstructions"] p')).map(txt).filter(Boolean);
  if (!st.length) { const ri = doc.querySelector('[itemprop="recipeInstructions"]'); if (ri) st = steps(ri.innerHTML); }
  if (!st.length) st = listAfter(/^(preparazione|procedimento)/i);
  let image = img(r && r.image) || meta('og:image') || meta('twitter:image');
  try { if (image) image = new URL(image, pageUrl).href; } catch (e) {}
  return {
    v: 1,
    title: (r && r.name) || meta('og:title') || txt(doc.querySelector('h1')) || txt(doc.querySelector('title')),
    image, ingredients: ing, steps: st,
    category: (r && [].concat(r.recipeCategory || []).join(' ')) || '',
    servings: (r && [].concat(r.recipeYield || [])[0]) || '',
    time: (r && (r.totalTime || r.cookTime)) || '',
    source: pageUrl
  };
}
async function importFromUrl(url) {
  url = String(url || '').trim();

  url = m[0];

  importPreview(d);
}

/* ================= DISPENSA ================= */
const STOP = new Set(['di','del','della','dello','dei','degli','delle','al','alla','allo','ai','agli','alle','con','e','ed','in','per','da','a','il','lo','la','i','gli','le','un','una','uno','g','gr','kg','ml','l','cl','q','b','qb','cucchiai','cucchiaio','cucchiaino','cucchiaini','pizzico','spicchi','spicchio','fette','fetta','foglie','bicchiere','circa','fresco','fresca','freschi','fresche','intero','intera','bio','biologico','biologica']);
const stem = w => w.length >= 4 ? w.replace(/[aeio]$/, '') : w;
const tokens = s => norm(s).replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(w => w.length > 1 && !STOP.has(w)).map(stem);
function itemMatches(line, item) {
  const k = tokens(item.key || item.name);
  if (!k.length) return false;
  const t = new Set(tokens(line));
  return k.every(w => t.has(w));
}
const stapleList = () => S.set.staples.split(',').map(x => x.trim()).filter(Boolean).map(x => ({key:x}));
const isStaple = (line, st) => st.some(s => itemMatches(line, s));
function guessKey(name) { const w = norm(name).replace(/[^a-z\s]/g, ' ').split(/\s+/).filter(x => x.length > 2 && !STOP.has(x)); return w[0] || norm(name); }

function daysLeft(exp) {
  if (!exp) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((new Date(exp + 'T00:00:00') - t) / 86400000);
}
function status(item) {
  const d = daysLeft(item.expiry);
  if (d === null) return 'none';
  if (d < 0) return 'bad';
  if (d <= S.set.yellow) return 'warn';
  return 'ok';
}
function expLabel(item) {
  const d = daysLeft(item.expiry);
  if (d === null) return 'Senza scadenza';
  if (d < -1) return 'Scaduto da ' + (-d) + ' giorni';
  if (d === -1) return 'Scaduto ieri';
  if (d === 0) return 'Scade oggi';
  if (d === 1) return 'Scade domani';
  if (d <= 60) return 'Scade tra ' + d + ' giorni';
  return 'Scade il ' + new Date(item.expiry).toLocaleDateString('it-IT', {day:'numeric', month:'short', year:'numeric'});
}
function pantryAlert() {
  const bad = S.pantry.filter(p => status(p) === 'bad').length, warn = S.pantry.filter(p => status(p) === 'warn').length;
  if (!bad && !warn) return null;
  const parts = [];
  if (warn) parts.push(warn + (warn === 1 ? ' prodotto in scadenza' : ' prodotti in scadenza'));
  if (bad) parts.push(bad + (bad === 1 ? ' scaduto' : ' scaduti'));
  return {text:parts.join(' e '), bad:bad > 0};
}

/* Ritaglia, ingrandisce e trasforma in bianco/nero (soglia di Otsu) per aiutare l'OCR,
   anche con le date stampate a puntini. flip = inverte i colori rispetto alla scelta automatica. */
function prepCanvas(src, sx, sy, sw, sh, flip) {
  const scale = Math.min(3, 1400 / sw);
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(sw * scale)); cv.height = Math.max(1, Math.round(sh * scale));
  const ctx = cv.getContext('2d', {willReadFrequently:true});
  ctx.filter = 'grayscale(1) contrast(1.5) blur(' + Math.max(.4, .7 * scale).toFixed(1) + 'px)';
  ctx.drawImage(src, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  ctx.filter = 'none';
  const img = ctx.getImageData(0, 0, cv.width, cv.height), d = img.data, hist = new Array(256).fill(0);
  for (let i = 0; i < d.length; i += 4) hist[d[i]]++;
  const total = d.length / 4;
  let sum = 0; for (let t = 0; t < 256; t++) sum += t * hist[t];
  let sumB = 0, wB = 0, best = 0, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue;
    const wF = total - wB; if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF, v = wB * wF * (mB - mF) * (mB - mF);
    if (v > best) { best = v; thr = t; }
  }
  let dark = 0;
  for (let i = 0; i < d.length; i += 4) if (d[i] <= thr) dark++;
  const inv = (dark > total / 2) !== !!flip;
  for (let i = 0; i < d.length; i += 4) { let v = d[i] > thr ? 255 : 0; if (inv) v = 255 - v; d[i] = d[i + 1] = d[i + 2] = v; }
  ctx.putImageData(img, 0, 0);
  return cv;
}
function scanner(mode) {
  return new Promise(async resolve => {
    const ov = document.createElement('div');

    ov.innerHTML = '<video playsinline muted autoplay></video><div class="guide ' + mode + '"><i></i></div>' +
      '<div class="shint">' + (mode === 'barcode' ? 'Inquadra il codice a barre' : 'Metti la data di scadenza dentro il riquadro') + '<div class="slive"></div></div>' +
      '<div class="sbar"><button class="btn ghost" data-a="x">Annulla</button><button class="btn ghost" data-a="t" hidden>🔦 Luce</button><button class="btn ghost" data-a="p">📷 Foto</button><button class="btn ghost" data-a="m">⌨️ A mano</button></div>';
    document.body.appendChild(ov);
    let stream = null, done = false, loopT = null, torch = false;
    const finish = v => { if (done) return; done = true; clearTimeout(loopT); if (stream) stream.getTracks().forEach(t => t.stop()); ov.remove(); resolve(v); };
    $('[data-a="x"]', ov).onclick = () => finish(null);
    $('[data-a="m"]', ov).onclick = () => finish({manual:true});
    $('[data-a="p"]', ov).onclick = () => finish({photo:true});
    const live = $('.slive', ov);
    try {
      stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080}}});
    } catch (e) { finish({error:'camera'}); return; }
    if (done) { stream.getTracks().forEach(t => t.stop()); return; }
    const video = $('video', ov);
    video.srcObject = stream;
    try { await video.play(); } catch (e) {}
    await new Promise(r => { if (video.videoWidth) r(); else video.onloadedmetadata = r; });
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes('continuous')) track.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(() => {});
    if (caps.torch) {
      const tb = $('[data-a="t"]', ov); tb.hidden = false;
      tb.onclick = () => { torch = !torch; track.applyConstraints({advanced:[{torch}]}).catch(() => {}); };
    }
    const guideRect = () => {
      const g = $('.guide', ov).getBoundingClientRect(), v = video.getBoundingClientRect();
      const vw = video.videoWidth, vh = video.videoHeight, k = Math.max(v.width / vw, v.height / vh);
      const ox = (v.width - vw * k) / 2, oy = (v.height - vh * k) / 2;

      return {x, y, w:Math.min(vw - x, g.width / k), h:Math.min(vh - y, g.height / k)};
    };

      if (!('BarcodeDetector' in window)) { finish({error:'detector'}); return; }
      let formats = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'];
      try { const sup = await BarcodeDetector.getSupportedFormats(); const f = formats.filter(x => sup.includes(x)); if (f.length) formats = f; } catch (e) {}
      const bd = new BarcodeDetector({formats});

        if (done) return;
        try {
          const res = await bd.detect(video);
          const code = res.map(x => x.rawValue).find(v => /^\d{8,14}$/.test(v));

            if (code === last) hits++; else { last = code; hits = 1; }

          }

        loopT = setTimeout(tick, 80);

      live.textContent = 'Preparo il lettore di date… (la prima volta serve qualche secondo)';
      let w;
      try { w = await getOcr(); } catch (e) { finish({error:'ocr'}); return; }
      if (done) return;
      live.textContent = 'Cerco la data…';
      let last = '';
      const tick = async () => {
        if (done) return;
        try {
          const g = guideRect();
          for (const flip of [false, true]) {
            const {data} = await w.recognize(prepCanvas(video, g.x, g.y, g.w, g.h, flip));
            if (done) return;
            const txt = data.text.replace(/\s+/g, ' ').trim();
            if (txt && !flip) live.textContent = 'Leggo: ' + txt.slice(0, 32);
            const d = parseExpiry(txt);

              if (d === last) { if (navigator.vibrate) navigator.vibrate(80); beepShort(); finish({value:d}); return; }
              last = d; live.textContent = 'Trovata ' + d.split('-').reverse().join('/') + ', confermo…';

            }

      };
      tick();
    }
  });
}

const MONTHS = {GEN:1, JAN:1, FEB:2, MAR:3, APR:4, MAG:5, MAY:5, GIU:6, JUN:6, LUG:7, JUL:7, AGO:8, AUG:8, SET:9, SEP:9, OTT:10, OCT:10, NOV:11, DIC:12, DEC:12};
function parseExpiry(text) {
  let t = ' ' + String(text || '').toUpperCase() + ' ';
  t = t.replace(/(?<=\d)[OQ](?=[\d./\-])|(?<=[\d./\-])[OQ](?=\d)|(?<= )[OQ](?=\d)/g, '0').replace(/(?<=\d)[IL|](?=[\d./\-])|(?<=[\d./\-])[IL|](?=\d)/g, '1').replace(/(?<=\d)S(?=\d)/g, '5').replace(/(?<=\d)B(?=\d)/g, '8').replace(/\s+/g, ' ');
  const y0 = new Date().getFullYear();
  const Y = y => y < 100 ? 2000 + y : y;
  const ok = (y, mo, d) => mo >= 1 && mo <= 12 && d >= 1 && d <= 31 && y >= y0 - 1 && y <= y0 + 8;
  const cands = [];
  let m;
  const full = /(?<!\d)(\d{1,2}) ?[./\-: ] ?(\d{1,2}) ?[./\-: ] ?(\d{4}|\d{2})(?!\d)/g;
  while ((m = full.exec(t))) { const d = +m[1], mo = +m[2], y = Y(+m[3]); if (ok(y, mo, d)) cands.push(new Date(y, mo - 1, d)); }
  const mon = /(?<!\d)(?:(\d{1,2}) ?[./\- ]? ?)?(GEN|JAN|FEB|MAR|APR|MAG|MAY|GIU|JUN|LUG|JUL|AGO|AUG|SET|SEP|OTT|OCT|NOV|DIC|DEC)[A-Z]*\.? ?[./\- ]? ?(\d{4}|\d{2})(?!\d)/g;
  while ((m = mon.exec(t))) {
    const mo = MONTHS[m[2]], y = Y(+m[3]), d = m[1] ? +m[1] : new Date(y, mo, 0).getDate();
    if (ok(y, mo, d)) cands.push(new Date(y, mo - 1, d));
  }
  if (!cands.length) {
    const my = /(?<![\d./\-])(\d{1,2}) ?[./\-] ?(\d{4}|\d{2})(?![\d./\-])/g;
    while ((m = my.exec(t))) { const mo = +m[1], y = Y(+m[2]); if (ok(y, mo, 1)) cands.push(new Date(y, mo, 0)); }
  }
  if (!cands.length) {
    const packed = /(?<!\d)(\d{2})(\d{2})(\d{4}|\d{2})(?!\d)/g;
    while ((m = packed.exec(t))) { const d = +m[1], mo = +m[2], y = Y(+m[3]); if (ok(y, mo, d)) cands.push(new Date(y, mo - 1, d)); }
  }
  if (!cands.length) return null;
  cands.sort((a, b) => b - a);
  const d = cands[0];
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function suggestions() {
  const st = stapleList();
  const out = [];
  for (const r of S.recipes) {
    const lines = r.ingredients.filter(l => !isStaple(l, st));
    if (!lines.length) continue;
    let have = 0; const expiring = new Map(); const missing = [];
    for (const l of lines) {
      const hits = S.pantry.filter(p => itemMatches(l, p));
      if (hits.length) { have++; hits.forEach(p => { const s = status(p); if (s === 'warn' || s === 'bad') expiring.set(p.id, p); }); }
      else missing.push(l);
    }
    if (!have) continue;
    const ratio = have / lines.length;
    out.push({r, have, total:lines.length, missing, expiring:[...expiring.values()], score:ratio + expiring.size * .25});
  }
  return out.sort((a, b) => b.score - a.score);
}

  const today = new Date().toISOString().slice(0, 10);
  if (!('Notification' in window) || Notification.permission !== 'granted' || S.set.lastNotify === today) return;
  const a = pantryAlert(); if (!a) return;
  try { new Notification('Dispensa', {body:a.text.charAt(0).toUpperCase() + a.text.slice(1) + '. Guarda cosa puoi cucinare.'}); } catch (e) {}
  S.set.lastNotify = today; saveSettings();
}

/* ================= AVVIO ================= */
const SAMPLE = {
  id:'esempio-sugo', created:0, fav:false, category:'salse', image:'', servings:'4', time:'30 min', format:'bimby', source:'',
  title:'Sugo al pomodoro e basilico (esempio)',
  ingredients:['1 cipolla piccola', '30 g olio extravergine di oliva', '700 g passata di pomodoro', '1 cucchiaino di zucchero', 'sale q.b.', '6 foglie di basilico'],
  steps:['Mettere la cipolla nel boccale e tritare 5 sec. vel. 5. Riunire sul fondo con la spatola.', 'Aggiungere l\u2019olio e soffriggere 3 min. 100° vel. 1.', 'Unire passata, zucchero e sale e cuocere 20 min. 100° antiorario vel. soft senza misurino.', 'Aggiungere il basilico spezzettato e mescolare 10 sec. antiorario vel. 2.']
};
async function loadAll() {
  S.recipes = await DB.all('recipes');
  S.pantry = await DB.all('pantry');
  const kv = await DB.all('kv');
  const st = kv.find(x => x.id === 'settings');
  if (st) S.set = Object.assign(S.set, st);
  const mn = kv.find(x => x.id === 'menu');
  if (mn) S.menu = Object.assign({id:'menu', plan:{}, have:{}, extra:{}}, mn);
}
(async function init() {
  try { await DB.open(); } catch (e) { $('#app').innerHTML = '<p class="empty">Il browser non permette di salvare dati (forse sei in navigazione in incognito).</p>'; return; }
  await loadAll();
  if (IS_TEST) $('#envBadge').hidden = false;
  if (!S.set.seeded) { await DB.put('recipes', SAMPLE); S.recipes.push(SAMPLE); S.set.seeded = true; await saveSettings(); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  history.replaceState({n:1}, '');
  render();
  notifyExpiring();
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  const sp = new URLSearchParams(location.search);
  const shared = [sp.get('url'), sp.get('text'), sp.get('title')].filter(Boolean).join(' ');
  if (shared) {
    history.replaceState({n:1}, '', location.pathname);
    importFromUrl(shared);
  }
  const hm = location.hash.match(/^#import=(.+)$/);
  if (hm) {
    history.replaceState({n:1}, '', location.pathname + location.search);
    try { importPreview(decodePayload(decodeURIComponent(hm[1]))); } catch (e) { toast('Import non riuscito: riprova con ＋ → Incolla'); }
  }
})();
</script>
